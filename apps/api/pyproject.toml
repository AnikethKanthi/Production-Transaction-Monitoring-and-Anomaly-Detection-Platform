[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-api"
version = "0.1.0"
description = "FastAPI service for the transaction monitoring platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
ml = ["joblib>=1.4,<2", "numpy>=2.1,<3", "scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
