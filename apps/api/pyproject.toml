[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-api"
version = "1.0.0"
description = "FastAPI service for the transaction monitoring platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "redis==6.4.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]
ml = ["joblib==1.6.0", "numpy==2.5.4", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL via TEST_DATABASE_URL", "security: exercises real authentication and request protection"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
