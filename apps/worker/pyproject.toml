[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-worker"
version = "1.0.0"
description = "Background worker bootstrap for transaction monitoring"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.16.0",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "prometheus-client==0.26.0",
    "redis==6.4.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.0.54",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["worker*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
