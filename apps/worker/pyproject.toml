[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-monitoring-worker"
version = "0.1.0"
description = "Background worker bootstrap for transaction monitoring"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6,<3",
    "joblib>=1.4,<2",
    "numpy>=2.1,<3",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0.36,<2.1",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["worker*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
