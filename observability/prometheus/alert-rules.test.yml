{
  "rule_files": [
    "alert-rules.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "APIUnavailable",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"api\"}",
          "values": "0+0x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "APIUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
          "alertname": "APIUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical",
                "job": "api"
              },
              "exp_annotations": {
                "summary": "APIUnavailable",
                "runbook_url": "https://github.com/AnikethKanthi/Production-Transaction-Monitoring-and-Anomaly-Detection-Platform/blob/main/docs/runbooks/operational-alerts.md"
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "APIUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "APIErrorSpike",
      "interval": "1m",
      "input_series": [
        {
          "series": "api_http_requests_total{status_code=\"500\"}",
          "values": "0+60x20"
        },
        {
          "series": "api_http_requests_total{status_code=\"200\"}",
          "values": "0+60x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "APIErrorSpike",
          "exp_alerts": []
        },
        {
          "eval_time": "16m",
