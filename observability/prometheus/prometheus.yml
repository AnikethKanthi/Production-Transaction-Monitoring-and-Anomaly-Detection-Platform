global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: business
    scrape_timeout: 10s
    metrics_path: /metrics/business
    static_configs:
      - targets: [api:8000]
  - job_name: api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: [api:8000]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:9101]
