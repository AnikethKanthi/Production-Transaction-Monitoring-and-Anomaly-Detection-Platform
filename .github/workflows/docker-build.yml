name: Container smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: python scripts/smoke_test.py
      - name: Verify migrated schema
        run: docker compose run --rm --no-deps migrate python -m alembic -c alembic.ini check
      - name: Verify infrastructure
        run: |
          docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          docker compose exec -T redis redis-cli ping
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic transactions.v1
      - name: Verify transaction event flow
        run: |
          python -m pip install -e './apps/worker'
          python scripts/generate_transactions.py --count 1 --interval 0
          sleep 3
          docker compose logs worker | grep 'Processed transaction event'
      - name: Capture container state
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
