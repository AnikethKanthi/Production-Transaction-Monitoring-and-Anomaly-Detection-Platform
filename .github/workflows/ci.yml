name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e 'apps/worker[dev]'
      - name: Create disposable operator identity
        run: |
          python scripts/create_auth_user.py --username e2e-operator --role operator --token-file .local/e2e.token > .local/e2e-user.json
          python -c "import json; print('AUTH_USERS='+json.dumps([json.load(open('.local/e2e-user.json'))]))" >> "$GITHUB_ENV"
      - name: Start clean application stack
        id: stack
        run: docker compose -p e2e-ci up --build -d --wait api worker web
      - name: Run service smoke and contract tests
        run: |
          python scripts/smoke_test.py
          python scripts/check_contracts.py
      - name: Generate and process a real anomalous event
        run: python scripts/run_end_to_end.py prepare --token-file .local/e2e.token --context .local/e2e-context.json
      - name: Investigate and resolve alert in the dashboard
        working-directory: apps/web
        env:
          E2E_CONTEXT_FILE: ${{ github.workspace }}/.local/e2e-context.json
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          PLAYWRIGHT_EXTERNAL_SERVER: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep "generated anomaly is visible"
      - name: Verify resolved state and audit trail
        run: python scripts/run_end_to_end.py verify --context .local/e2e-context.json
      - name: Capture service logs on failure
        if: failure() && steps.stack.outcome == 'success'
        run: docker compose -p e2e-ci logs --no-color > .local/e2e-services.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: end-to-end-failure
          path: |
            .local/e2e-services.log
            apps/web/test-results/
          include-hidden-files: true
      - name: Remove disposable stack
        if: always()
        run: docker compose -p e2e-ci down -v

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Audit Python runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install --upgrade --upgrade-strategy eager pip pip-audit 'apps/api[ml]' apps/worker
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit --local
      - name: Audit frontend runtime dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: transaction-monitoring-api:ci
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - image: transaction-monitoring-worker:ci
            context: .
            dockerfile: apps/worker/Dockerfile
          - image: transaction-monitoring-web:ci
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build --file '${{ matrix.dockerfile }}' --tag '${{ matrix.image }}' '${{ matrix.context }}'
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.image }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: '1'

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'apps/api[dev,ml]' -e 'apps/worker[dev]'
      - name: Create disposable load identity
        run: |
          python scripts/create_auth_user.py --username load-admin --role administrator --token-file .local/admin.token > .local-auth-user.json
          python -c "import json; print('AUTH_USERS='+json.dumps([json.load(open('.local-auth-user.json'))]))" >> "$GITHUB_ENV"
      - name: Start disposable stack
        id: stack
        run: docker compose -p drill-ci up --build -d --wait api worker
      - name: Measure API
        run: python scripts/run_load_test.py --count 60 --rate 2 --token-file .local/admin.token --report .local/system-api.json
      - name: Measure pipeline
        if: ${{ always() && steps.stack.outcome == 'success' }}
        run: python scripts/run_load_test.py --mode kafka --count 40 --report .local/system-pipeline.json
      - name: Capture query plans
        if: ${{ always() && steps.stack.outcome == 'success' }}
        run: python scripts/explain_queries.py --refresh-statistics --report .local/system-query-plans.json
      - name: Verify replay, interruptions, backup and restore
        if: ${{ always() && steps.stack.outcome == 'success' }}
        run: python scripts/run_recovery_drill.py --project drill-ci --output .local/recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-recovery-results
          path: |
            .local/system-*.json
            .local/recovery/report.json
          include-hidden-files: true
      - name: Remove disposable stack
        if: always()
        run: docker compose -p drill-ci down -v
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate operational alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/etc/prometheus" prom/prometheus:v3.2.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/rules" -w /rules prom/prometheus:v3.2.1 check rules alert-rules.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/rules" -w /rules prom/prometheus:v3.2.1 test rules alert-rules.test.yml
      - name: Validate Compose
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate provisioned dashboards and panel queries
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.2.1/prometheus-3.2.1.linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          python scripts/check_monitoring.py --promtool "$RUNNER_TEMP/prometheus-3.2.1.linux-amd64/promtool"
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [api, worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/${{ matrix.project }}/pyproject.toml
      - run: |
          if [ "${{ matrix.project }}" = "api" ]; then
            python -m pip install -e '.[dev,ml]'
          else
            python -m pip install -e '.[dev]'
          fi
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -m 'not integration'

  database:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monitoring_test
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql+psycopg://monitoring:ci-only-password@localhost:5432/monitoring_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ml]'
      - run: python -m pytest -m integration -W error
      - name: Test worker persistence and idempotency
        run: |
          python -m pip install -e '../worker[dev]'
          python -m pytest ../worker/tests -m integration -W error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
